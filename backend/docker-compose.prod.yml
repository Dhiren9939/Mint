name: mint-backend

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mint-backend/caddy-data:/data
    depends_on:
      - api
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 50m

  api:
    image: ${IMAGE_TAG:?IMAGE_TAG must be set}
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=85.0
        -XX:InitialRAMPercentage=40.0
        -XX:+UseG1GC
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      USER_FILES_BUCKET: ${USER_FILES_BUCKET:?USER_FILES_BUCKET must be set}
    # / is the frontend's index.html, it doesn't touch the db or the rate limiter
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 180s
      start_interval: 1s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 450m

  postgres:
    image: postgres:16-alpine
    command: [ "postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30" ]
    environment:
      POSTGRES_DB: mintdb
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mint-postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mintdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 250m

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "60", "1", "--maxmemory", "80mb",
               "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - mint-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 120m

volumes:
  mint-redis:
  mint-postgres:
networks:
  mint-net:
