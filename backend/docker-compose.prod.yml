name: mint-backend

services:
  api:
    image: ${IMAGE_TAG:?IMAGE_TAG must be set}
    ports:
      - "80:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:?REDIS_AUTH_TOKEN must be set}
      USER_FILES_BUCKET: ${USER_FILES_BUCKET:?USER_FILES_BUCKET must be set}
      DYNAMO_TABLE: ${DYNAMO_TABLE:?DYNAMO_TABLE must be set}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=85.0
        -XX:InitialRAMPercentage=40.0
        -XX:+UseG1GC
    volumes:
      - /opt/mint-backend/config/:/app/config/:ro
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

networks:
  mint-net:
