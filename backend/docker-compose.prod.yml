name: mint-backend

services:
  api:
    image: ${IMAGE_TAG:?IMAGE_TAG must be set}
    ports:
      - "80:8080"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dspring.config.location=classpath:/,/tmp/
        -XX:MaxRAMPercentage=85.0
        -XX:InitialRAMPercentage=40.0
        -XX:+UseG1GC
    volumes:
      - /tmp/:/tmp/
    depends_on:
      redis:
        condition: service_healthy
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "60", "1", "--maxmemory", "200mb",
               "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - mint-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 200m

volumes:
  mint-redis:
networks:
  mint-net:
