name: mint-backend

services:
  api:
    image: ${IMAGE_TAG:?IMAGE_TAG must be set}
    ports:
      - "80:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=85.0
        -XX:InitialRAMPercentage=40.0
        -XX:+UseG1GC
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
    volumes:
      - /opt/mint-backend/config/:/app/config/:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "60", "1", "--maxmemory", "150mb",
               "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - mint-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      mint-net:
    restart:
      unless-stopped
    deploy:
      resources:
        limits:
          memory: 200m

volumes:
  mint-redis:
networks:
  mint-net:
