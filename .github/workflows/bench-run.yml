name: bench-run

# Runs bench/k6/main.js (the sender/receiver load) against a live bench arm, via SSM on
# the shared load-gen instance (see loadgen.yml / bench/loadgen/), and uploads the
# results as workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL of the arm under test, e.g. https://mint-bench-ecs.dhiren.xyz"
        required: true
        type: string
      sender_vus:
        description: "Peak sender VUs"
        required: true
        type: string
        default: "5"
      receiver_vus:
        description: "Peak receiver VUs"
        required: true
        type: string
        default: "20"
      duration_minutes:
        description: "Minutes to hold at peak VUs (30s ramp up, 15s ramp down are added on top)"
        required: true
        type: string
        default: "5"
      arm_name:
        description: "Arm name, used for the results path and CloudWatch dimension, e.g. bench-ecs"
        required: true
        type: string

concurrency:
  group: loadgen-lifecycle
  cancel-in-progress: false

jobs:
  run:
    if: github.ref_name == 'main'
    environment: loadgen
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - uses: aws-actions/configure-aws-credentials@v6
        name: Configure AWS Credentials
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}

      - name: Check Load Generator Is Up
        run: |
          if [ -z "${{ vars.LOADGEN_INSTANCE_ID }}" ] || [ -z "${{ vars.LOADGEN_RESULTS_BUCKET }}" ]; then
            echo "::error::No load-gen instance found -- run loadgen.yml with action=up first"
            exit 1
          fi

      - name: Stage k6 Scripts
        env:
          RESULTS_BUCKET: ${{ vars.LOADGEN_RESULTS_BUCKET }}
        run: |
          aws s3 sync bench/k6 "s3://$RESULTS_BUCKET/scripts/k6" --delete
          aws s3 cp bench/loadgen/run-scenario.sh "s3://$RESULTS_BUCKET/scripts/run-scenario.sh"

      - name: Run k6 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.LOADGEN_INSTANCE_ID }}
          RESULTS_BUCKET: ${{ vars.LOADGEN_RESULTS_BUCKET }}
          TARGET_URL: ${{ inputs.target_url }}
          SENDER_VUS: ${{ inputs.sender_vus }}
          RECEIVER_VUS: ${{ inputs.receiver_vus }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          ARM_NAME: ${{ inputs.arm_name }}
        run: |
          RUN_SCRIPT="chmod +x /opt/loadgen/run-scenario.sh && /opt/loadgen/run-scenario.sh \
            '$SENDER_VUS' '$RECEIVER_VUS' '$DURATION_MINUTES' '$TARGET_URL' '$ARM_NAME' '$RESULTS_BUCKET'"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"$RUN_SCRIPT\"]}" \
            --timeout-seconds 3600 \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          # Ramp-up (30s) + hold (duration_minutes) + ramp-down (15s), plus generous
          # headroom for k6 startup/teardown and the SSM round trip.
          MAX_WAIT_SECONDS=$(( (DURATION_MINUTES * 60) + 45 + 300 ))
          ELAPSED=0
          STATUS="InProgress"
          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
            if [ "$ELAPSED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "::error::Timed out waiting for the SSM command after ${ELAPSED}s"
              exit 1
            fi
            sleep 15
            ELAPSED=$((ELAPSED + 15))
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM command status: $STATUS (${ELAPSED}s elapsed)"
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::run-scenario.sh failed on the load-gen instance (status=$STATUS) -- a real script/setup error, not a k6 threshold breach (those are absorbed inside run-scenario.sh)"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text)
          echo "$OUTPUT"

          RESULT_PREFIX=$(echo "$OUTPUT" | grep -oP '(?<=RESULT_S3_PREFIX=).*' | tail -1)
          if [ -z "$RESULT_PREFIX" ]; then
            echo "::error::Could not find RESULT_S3_PREFIX in the command output"
            exit 1
          fi
          echo "result_prefix=$RESULT_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Download Results
        env:
          RESULTS_BUCKET: ${{ vars.LOADGEN_RESULTS_BUCKET }}
          RESULT_PREFIX: ${{ steps.ssm.outputs.result_prefix }}
        run: |
          mkdir -p bench-results
          aws s3 cp "s3://$RESULTS_BUCKET/$RESULT_PREFIX/summary.json" bench-results/summary.json
          aws s3 cp "s3://$RESULTS_BUCKET/$RESULT_PREFIX/run-metadata.json" bench-results/run-metadata.json

      # Best-effort: only useful once infra/modules/monitoring (Stage 2) has produced a
      # dashboard for this arm. Never fails the job -- a missing dashboard just means no
      # PNGs this run.
      - name: Fetch Dashboard Widget Snapshot
        continue-on-error: true
        env:
          ARM_NAME: ${{ inputs.arm_name }}
        run: |
          # Covers the ramp-up (30s) + hold (duration_minutes) + ramp-down (15s) window,
          # plus a few minutes of buffer either side.
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WINDOW_MINUTES=$(( ${{ inputs.duration_minutes }} + 5 ))
          START=$(date -u -d "-${WINDOW_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          aws cloudwatch get-metric-widget-image \
            --metric-widget "{\"metrics\":[[\"K6\",\"download_p95\",\"Arm\",\"$ARM_NAME\"],[\"K6\",\"download_p99\",\"Arm\",\"$ARM_NAME\"]],\"start\":\"$START\",\"end\":\"$END\",\"title\":\"k6 download latency - $ARM_NAME\"}" \
            --output-format png \
            bench-results/k6-latency-widget.png || echo "No widget image available (dashboard may not exist for this arm yet)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ inputs.arm_name }}-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 90

# No commit-back step: no existing workflow in this repo commits results back to the
# repo (checked infra-cd.yml, backend-cd.yml, destroy-app.yml, create-app.yml -- none
# do), so results are published as a workflow artifact instead of under
# bench/results/<arm>/. If auto-committing under bench/results/<arm>/<scenario>/ is
# still wanted, that's a deliberate follow-up, not implemented here.
