name: infra-apply

# manual on purpose: a change to the box's user data replaces the instance,
# and the postgres data lives on its disk. Run with apply off first to read the plan.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan, otherwise only show it"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.3"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}

      - run: terraform init -input=false

      - run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.apply }}
        run: terraform apply -no-color -input=false tfplan
