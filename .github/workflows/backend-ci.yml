name: backend-ci

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - ".github/workflows/scripts/redeploy.sh"

jobs:
  tests-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7
        name: Pull Files
      - uses: actions/setup-java@v5
        name: Setup Java
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: actions/cache@v6
        name: Warmup Cache
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-
      - name: Run Tests
        run: mvn clean test
      - name: Build Backend
        run: mvn package -DskipTests
