name: backend-ci

on:
  workflow_call:
    inputs:
      called:
        type: boolean
        default: true
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - ".github/workflows/env-config.yml"
      - ".github/workflows/scripts/redeploy.sh"

jobs:
  # Callers have already checked the toggles
  config:
    if: ${{ !inputs.called }}
    uses: ./.github/workflows/env-config.yml

  tests-package:
    needs: config
    if: ${{ !cancelled() && (inputs.called || needs.config.outputs.run-ci == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7
        name: Pull Files
      - uses: actions/setup-java@v5
        name: Setup Java
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: actions/cache@v6
        name: Warmup Cache
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-
      - name: Build Backend
        run: mvn package
