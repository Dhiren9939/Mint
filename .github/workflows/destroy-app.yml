name: destory-app

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-lifecycle
  cancel-in-progress: false

jobs:
  destory:
    if: inputs.confirm == 'destroy'
    environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          working-directory: "./infra"

      - name: Terraform Destroy
        run: terraform destroy -no-color -input=false -auto-approve

      - name: Delete Infra Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          gh variable delete EC2_PUBLIC_IP --env prod || true
          gh variable delete CLOUDFRONT_ID --env prod || true
