name: destroy-app

# Run from the environment's branch: main destroys prod, any other branch its own environment.
# Not gated by CD_ENABLED so an environment can always be torn down.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the environment name (prod for main) to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-lifecycle
  cancel-in-progress: false

jobs:
  config:
    uses: ./.github/workflows/env-config.yml

  destroy:
    needs: config
    if: needs.config.outputs.deployable == 'true' && inputs.confirm == needs.config.outputs.environment
    environment: ${{ needs.config.outputs.environment }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ needs.config.outputs.environment }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          working-directory: "./infra"
          environment: ${{ env.ENVIRONMENT }}

      - name: Terraform Destroy
        env:
          TF_VAR_REDIS_AUTH_TOKEN: ${{ secrets.TF_VAR_REDIS_AUTH_TOKEN }}
        run: terraform destroy -no-color -input=false -auto-approve -var-file="envs/$ENVIRONMENT.tfvars"

      - name: Delete Environment Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          for name in EC2_PUBLIC_IP REDIS_HOST DYNAMO_TABLE USER_FILES_BUCKET FRONTEND_BUCKET CLOUDFRONT_ID; do
            gh variable delete "$name" --env "$ENVIRONMENT" || true
          done
