name: backend-cd

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ECS_CLUSTER:
        type: string
        required: true
      ECS_SERVICE:
        type: string
        required: true
      TASK_FAMILY:
        type: string
        required: true
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - ".github/workflows/env-config.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}-backend
  cancel-in-progress: true

jobs:
  # Callers pass the environment and have already checked the toggles
  config:
    if: ${{ !inputs.environment }}
    uses: ./.github/workflows/env-config.yml

  run-ci:
    needs: config
    if: ${{ !cancelled() && (inputs.environment || needs.config.outputs.run-ci == 'true') }}
    uses: ./.github/workflows/backend-ci.yml

  build-push:
    needs: [config, run-ci]
    if: ${{ !cancelled() && needs.run-ci.result == 'success' && (inputs.environment || needs.config.outputs.run-cd == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tags.outputs.COMMIT_TAG }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Files
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tags
        id: tags
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          LOWERCASE_REPO_OWNER="${REPO_OWNER,,}"
          echo "COMMIT_TAG=ghcr.io/$LOWERCASE_REPO_OWNER/mint-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=ghcr.io/$LOWERCASE_REPO_OWNER/mint-backend:latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: backend
          tags: |
            ${{ steps.tags.outputs.COMMIT_TAG }}
            ${{ steps.tags.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [config, build-push]
    if: ${{ !cancelled() && needs.build-push.result == 'success' }}
    environment: ${{ inputs.environment || needs.config.outputs.environment }}
    runs-on: ubuntu-latest
    env:
      ECS_CLUSTER: ${{ inputs.ECS_CLUSTER || vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ inputs.ECS_SERVICE || vars.ECS_SERVICE }}
      TASK_FAMILY: ${{ inputs.TASK_FAMILY || vars.TASK_FAMILY }}

    steps:
      # Nothing to deploy to while the environment's infra is down
      - name: Check Service
        id: service
        run: |
          if [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ] || [ -z "$TASK_FAMILY" ]; then
            echo "::notice::No ECS service in this environment, skipping deploy"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        name: Configure AWS Credentials
        if: steps.service.outputs.exists == 'true'
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}

      # Terraform owns the task settings (size, env, secrets, roles), so start from its
      # latest revision and only swap in this commit's image
      - name: Download Task Definition
        if: steps.service.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: Set Image
        id: render
        if: steps.service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ needs.build-push.outputs.image-tag }}

      # Registers the new revision and starts a rolling deploy
      - name: Deploy to ECS
        id: deploy
        if: steps.service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # The deploy action can return while the rollout is still in progress, and a deploy the
      # circuit breaker rolled back also ends stable, so wait for the rollout and check what runs
      - name: Verify Rollout
        if: steps.service.outputs.exists == 'true'
        timeout-minutes: 15
        env:
          EXPECTED: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          while true; do
            read -r running state <<< "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[taskDefinition, rolloutState]" --output text)"
            [ "$state" != "IN_PROGRESS" ] && break
            echo "Rollout of $running in progress"
            sleep 15
          done
          if [ "$running" != "$EXPECTED" ] || [ "$state" != "COMPLETED" ]; then
            echo "::error::Deploy did not complete, the service runs $running ($state) instead of $EXPECTED"
            exit 1
          fi
          echo "::notice::Running $EXPECTED"
