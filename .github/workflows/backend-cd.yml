name: backend-cd

on:
  workflow_call:
    inputs:
      EC2_PUBLIC_IP:
        type: string
        required: true
      REDIS_HOST:
        type: string
        required: true
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - ".github/workflows/scripts/redeploy.sh"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-backend
  cancel-in-progress: true

jobs:
  run-ci:
    if: vars.CICD_ENABLED != 'false' && (inputs.EC2_PUBLIC_IP != '' || vars.EC2_PUBLIC_IP != '')
    uses: ./.github/workflows/backend-ci.yml

  build-push:
    runs-on: ubuntu-latest
    needs: run-ci
    outputs:
      image-tag: ${{ steps.tags.outputs.COMMIT_TAG }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Files
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tags
        id: tags
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          LOWERCASE_REPO_OWNER="${REPO_OWNER,,}"
          echo "COMMIT_TAG=ghcr.io/$LOWERCASE_REPO_OWNER/mint-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=ghcr.io/$LOWERCASE_REPO_OWNER/mint-backend:latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: backend
          tags: |
            ${{ steps.tags.outputs.COMMIT_TAG }}
            ${{ steps.tags.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    environment: prod
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v7
        name: Pull Files

      - name: Bundle Config Files
        run: |
          mkdir bundle-config
          cp backend/docker-compose.prod.yml .github/workflows/scripts/redeploy.sh backend/src/main/resources/application.properties backend/src/main/resources/application-prod.properties bundle-config/

      - name: Upload Config
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ inputs.EC2_PUBLIC_IP || vars.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          source: "bundle-config/"
          target: "/tmp/"
          overwrite: true
          strip_components: 1

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
          REDIS_HOST: ${{ inputs.REDIS_HOST || vars.REDIS_HOST }}
          REDIS_AUTH_TOKEN: ${{ secrets.TF_VAR_REDIS_AUTH_TOKEN }}
        with:
          host: ${{ inputs.EC2_PUBLIC_IP || vars.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,REDIS_HOST,REDIS_AUTH_TOKEN
          script: |
            sudo -E bash /tmp/redeploy.sh
