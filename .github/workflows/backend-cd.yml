name: backend-cd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read
  id-token: write

jobs:
  # run-ci:
  #   uses: ./.github/workflows/backend-ci.yml

  build-push:
    runs-on: ubuntu-latest
    # needs: run-ci
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Files
        uses: actions/checkout@v7

      - name: Setup Docker
        uses: docker/setup-docker-action@v5.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: Dhiren9939
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: backend
          tags: dhiren9939/mint-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # redeploy:
  #   runs-on: ubuntu-latest
  #   needs: build-push
