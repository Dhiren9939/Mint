name: backend-cd

# The api image carries the frontend, so this is the deploy for both.
# The image builds while the tests run and goes to ghcr, the box only pulls the layers that changed.

on:
  workflow_dispatch:
  push:
    branches: [fast-deploy-single-ec2]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - ".github/workflows/backend-build.yml"
      - ".github/workflows/backend-deploy.yml"
      - ".github/workflows/scripts/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: fast-deploy-single-ec2-backend
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/backend-build.yml

  deploy:
    needs: build
    uses: ./.github/workflows/backend-deploy.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
