name: backend-cd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # run-ci:
  #   uses: ./.github/workflows/backend-ci.yml

  build-push:
    runs-on: ubuntu-latest
    # needs: run-ci
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Files
        uses: actions/checkout@v7

      - name: Setup Docker
        uses: docker/setup-docker-action@v5.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tags
        id: tags
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          LOWERCASE_REPO_OWNER="${REPO_OWNER,,}"
          echo "COMMIT_TAG=ghcr.io/$LOWERCASE_REPO_OWNER/mint-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=ghcr.io/$LOWERCASE_REPO_OWNER/mint-backend:latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: backend
          tags: |
            ${{ steps.tags.outputs.COMMIT_TAG }}
            ${{ steps.tags.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # redeploy:
  #   runs-on: ubuntu-latest
  #   needs: build-push
