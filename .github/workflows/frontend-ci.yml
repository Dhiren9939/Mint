name: frontend-ci

# no build here, the image build in backend-cd runs tsc and vite anyway

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.1.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint Checks
        run: npm run lint

      - name: Run Tests
        run: npm test
