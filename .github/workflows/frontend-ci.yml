name: frontend-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  bulid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.1.0"
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
