name: frontend-ci

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

jobs:
  bulid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.1.0"
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
