name: create-app

# Run from the environment's branch: main creates prod, any other branch its own environment

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-lifecycle
  cancel-in-progress: false

jobs:
  config:
    permissions:
      contents: read
    uses: ./.github/workflows/env-config.yml

  infra-cd:
    needs: config
    if: needs.config.outputs.run-cd == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra-cd.yml
    with:
      environment: ${{ needs.config.outputs.environment }}
    secrets: inherit

  frontend-cd:
    needs: [config, infra-cd]
    if: needs.infra-cd.outputs.FRONTEND_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/frontend-cd.yml
    with:
      environment: ${{ needs.config.outputs.environment }}
      FRONTEND_BUCKET: ${{ needs.infra-cd.outputs.FRONTEND_BUCKET }}
      CLOUDFRONT_ID: ${{ needs.infra-cd.outputs.CLOUDFRONT_ID }}
    secrets: inherit

  backend-cd:
    needs: [config, infra-cd]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/backend-cd.yml
    with:
      environment: ${{ needs.config.outputs.environment }}
      ECS_CLUSTER: ${{ needs.infra-cd.outputs.ECS_CLUSTER }}
      ECS_SERVICE: ${{ needs.infra-cd.outputs.ECS_SERVICE }}
      TASK_FAMILY: ${{ needs.infra-cd.outputs.TASK_FAMILY }}
    secrets: inherit
