name: create-app

# the image builds while terraform applies, so it's in ghcr before the box boots and pulls it

on:
  workflow_dispatch:

concurrency:
  group: fast-deploy-single-ec2-lifecycle
  cancel-in-progress: false

jobs:
  infra-cd:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra-cd.yml
    secrets: inherit

  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend-build.yml

  deploy:
    needs: [infra-cd, build]
    permissions:
      contents: read
    uses: ./.github/workflows/backend-deploy.yml
    with:
      image: ${{ needs.build.outputs.image }}
      APP_HOST: ${{ needs.infra-cd.outputs.APP_HOST }}
    secrets: inherit
