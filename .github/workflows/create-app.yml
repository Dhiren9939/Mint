name: create-app

# Run from the environment's branch: main creates prod, any other branch its own environment

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-lifecycle
  cancel-in-progress: false

jobs:
  config:
    permissions:
      contents: read
    uses: ./.github/workflows/env-config.yml

  infra-cd:
    needs: config
    if: needs.config.outputs.run-cd == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra-cd.yml
    with:
      environment: ${{ needs.config.outputs.environment }}
    secrets: inherit

  backend-cd:
    needs: [config, infra-cd]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/backend-cd.yml
    with:
      environment: ${{ needs.config.outputs.environment }}
      APP_HOST: ${{ needs.infra-cd.outputs.APP_HOST }}
    secrets: inherit
