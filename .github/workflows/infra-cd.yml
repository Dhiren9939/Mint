name: infra-cd

on:
  workflow_call:
    outputs:
      EC2_PUBLIC_IP:
        value: ${{ jobs.apply.outputs.EC2_PUBLIC_IP }}
      RDS_ENDPOINT:
        value: ${{ jobs.apply.outputs.RDS_ENDPOINT }}
      CLOUDFRONT_ID:
        value: ${{ jobs.apply.outputs.CLOUDFRONT_ID }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-cd.yml"
      - ".github/workflows/scripts/**"



concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  run-ci:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/infra-ci.yml
    secrets: inherit

  apply:
    permissions:
      id-token: write
      contents: read
    outputs:
      EC2_PUBLIC_IP: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
      RDS_ENDPOINT: ${{ steps.tf_out.outputs.RDS_ENDPOINT }}
      CLOUDFRONT_ID: ${{ steps.tf_out.outputs.CLOUDFRONT_ID }}

    needs: run-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - uses: hashicorp/setup-terraform@v4
        name: Setup Terraform
        with:
          terraform_version: "1.15.3"

      - uses: aws-actions/configure-aws-credentials@v6
        name: Configure AWS Credentials
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -no-color -input=false -auto-approve

      - name: Output Resource Details
        id: tf_out
        run: |
          echo "EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          HOST="$(terraform output -raw db_endpoint)"
          echo "RDS_ENDPOINT=${HOST%%:*}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Update Repo Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          gh variable set EC2_PUBLIC_IP --body "${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}"
          gh variable set RDS_ENDPOINT --body "${{ steps.tf_out.outputs.RDS_ENDPOINT }}"
          gh variable set CLOUDFRONT_ID --body "${{ steps.tf_out.outputs.CLOUDFRONT_ID }}"

      - name: SCP scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          source: ".github/workflows/scripts/configure-server.sh,.github/workflows/scripts/schema.sql"
          target: "/tmp/mint-backend/"
          strip_components: 3

      - name: Configure EC2 & RDS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RDS_ENDPOINT: ${{ steps.tf_out.outputs.RDS_ENDPOINT }}
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          envs: DB_USERNAME,DB_PASSWORD,RDS_ENDPOINT
          script: |
            sudo mkdir -p /opt/mint-backend/config/
            sudo cp -r /tmp/mint-backend/ /opt/
            sudo bash /opt/mint-backend/configure-server.sh
            export PGPASSWORD="$DB_PASSWORD"
            sudo -E bash -c 'PGSSLMODE="verify-full" PGSSLROOTCERT="/opt/mint-backend/config/global-bundle.pem" psql -U "$DB_USERNAME" -d mintdb -h "$RDS_ENDPOINT" -f /opt/mint-backend/schema.sql'
