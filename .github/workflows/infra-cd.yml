name: infra-cd

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    outputs:
      EC2_PUBLIC_IP:
        value: ${{ jobs.apply.outputs.EC2_PUBLIC_IP }}
      REDIS_HOST:
        value: ${{ jobs.apply.outputs.REDIS_HOST }}
      DYNAMO_TABLE:
        value: ${{ jobs.apply.outputs.DYNAMO_TABLE }}
      USER_FILES_BUCKET:
        value: ${{ jobs.apply.outputs.USER_FILES_BUCKET }}
      FRONTEND_ENABLED:
        value: ${{ jobs.apply.outputs.FRONTEND_ENABLED }}
      FRONTEND_BUCKET:
        value: ${{ jobs.apply.outputs.FRONTEND_BUCKET }}
      CLOUDFRONT_ID:
        value: ${{ jobs.apply.outputs.CLOUDFRONT_ID }}
  workflow_dispatch:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-cd.yml"
      - ".github/workflows/env-config.yml"
      - ".github/workflows/scripts/**"
      - ".github/actions/setup-aws-terraform/**"

concurrency:
  group: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}-infrastructure
  cancel-in-progress: false

jobs:
  # Callers pass the environment and have already checked the toggles
  config:
    if: ${{ !inputs.environment }}
    permissions:
      contents: read
    uses: ./.github/workflows/env-config.yml

  run-ci:
    needs: config
    if: ${{ !cancelled() && (inputs.environment || needs.config.outputs.run-ci == 'true') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra-ci.yml
    with:
      environment: ${{ inputs.environment || needs.config.outputs.environment }}
    secrets: inherit

  apply:
    needs: [config, run-ci]
    if: ${{ !cancelled() && needs.run-ci.result == 'success' && (inputs.environment || needs.config.outputs.run-cd == 'true') }}
    environment: ${{ inputs.environment || needs.config.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      EC2_PUBLIC_IP: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
      REDIS_HOST: ${{ steps.tf_out.outputs.REDIS_HOST }}
      DYNAMO_TABLE: ${{ steps.tf_out.outputs.DYNAMO_TABLE }}
      USER_FILES_BUCKET: ${{ steps.tf_out.outputs.USER_FILES_BUCKET }}
      FRONTEND_ENABLED: ${{ steps.tf_out.outputs.FRONTEND_ENABLED }}
      FRONTEND_BUCKET: ${{ steps.tf_out.outputs.FRONTEND_BUCKET }}
      CLOUDFRONT_ID: ${{ steps.tf_out.outputs.CLOUDFRONT_ID }}

    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment || needs.config.outputs.environment }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          working-directory: "./infra"
          environment: ${{ env.ENVIRONMENT }}

      - name: Terraform Apply
        env:
          TF_VAR_REDIS_AUTH_TOKEN: ${{ secrets.TF_VAR_REDIS_AUTH_TOKEN }}
        run: terraform apply -no-color -input=false -auto-approve -var-file="envs/$ENVIRONMENT.tfvars"

      - name: Output Resource Details
        id: tf_out
        run: |
          terraform output -json > /tmp/tf-outputs.json
          out() { jq -r --arg k "$1" '.[$k].value // empty' /tmp/tf-outputs.json; }
          {
            echo "EC2_PUBLIC_IP=$(out ec2_public_ip)"
            echo "REDIS_HOST=$(out redis_endpoint)"
            echo "DYNAMO_TABLE=$(out table_name)"
            echo "USER_FILES_BUCKET=$(out user_files_bucket)"
            echo "FRONTEND_ENABLED=$(out frontend_enabled)"
            echo "FRONTEND_BUCKET=$(out frontend_bucket_name)"
            echo "CLOUDFRONT_ID=$(out cloudfront_distribution_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Update Environment Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          EC2_PUBLIC_IP: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          REDIS_HOST: ${{ steps.tf_out.outputs.REDIS_HOST }}
          DYNAMO_TABLE: ${{ steps.tf_out.outputs.DYNAMO_TABLE }}
          USER_FILES_BUCKET: ${{ steps.tf_out.outputs.USER_FILES_BUCKET }}
          FRONTEND_BUCKET: ${{ steps.tf_out.outputs.FRONTEND_BUCKET }}
          CLOUDFRONT_ID: ${{ steps.tf_out.outputs.CLOUDFRONT_ID }}
        run: |
          for name in EC2_PUBLIC_IP REDIS_HOST DYNAMO_TABLE USER_FILES_BUCKET FRONTEND_BUCKET CLOUDFRONT_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              gh variable set "$name" --env "$ENVIRONMENT" --body "$value"
            else
              # Resources this environment doesn't have, e.g. no frontend
              gh variable delete "$name" --env "$ENVIRONMENT" || true
            fi
          done

      - name: SCP scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          source: ".github/workflows/scripts/configure-server.sh"
          target: "/tmp/mint-backend/"
          strip_components: 3

      - name: Configure EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /opt/mint-backend/config/
            sudo cp -r /tmp/mint-backend/ /opt/
            sudo bash /opt/mint-backend/configure-server.sh
