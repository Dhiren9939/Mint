name: infra-cd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/**"]

permissions:
  id-token: write
  pull-requests: write
  contents: read

jobs:
  run-ci:
    uses: ./.github/workflows/infra-ci.yml

  apply:
    needs: run-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - uses: hashicorp/setup-terraform@v4
        name: Setup Terraform
        with:
          terraform_version: "1.15.3"

      - uses: aws-actions/configure-aws-credentials@v6
        name: Configure AWS Credentials
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -no-color -input=false -auto-approve

      - name: Save Terraform Outputs
        id: tf_out
        run: |
          echo "EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "RDS_ENDPOINT=$(terraform output -raw db_endpoint)" >> $GITHUB_OUTPUT

      - name: Update Repo Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          gh variable set EC2_PUBLIC_IP --body "${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}"
          gh varibale set RDS_ENDPOINT --body "${{ steps.tf_out.outputs.RDS_ENDPOINT }}"

      - name: SCP scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP}}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/infra/configure-server.sh,scripts/db/schema.sql"
          target: "/tmp/"
          strip_components: 2

      - name: Configure EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo bash /tmp/configure-server.sh
            PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql -U ${{ secrets.DB_USERNAME }} -d mintdb -f /tmp/schema.sql
