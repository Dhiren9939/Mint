name: infra-cd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/**"]

permissions:
  id-token: write
  pull-requests: write
  contents: read

jobs:
  # run-ci:
  #   uses: ./.github/workflows/infra-ci.yml

  apply:
    # needs: run-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - uses: hashicorp/setup-terraform@v4
        name: Setup Terraform
        with:
          terraform_version: "1.15.3"

      - uses: aws-actions/configure-aws-credentials@v6
        name: Configure AWS Credentials
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -no-color -input=false -auto-approve

      - name: Output Resource Details
        id: tf_out
        run: |
          echo "EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          HOST="$(terraform output -raw db_endpoint)"
          echo "RDS_ENDPOINT=${HOST:0:-5}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Update Repo Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          gh variable set EC2_PUBLIC_IP --body "${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}"
          gh variable set RDS_ENDPOINT --body "${{ steps.tf_out.outputs.RDS_ENDPOINT }}"
          gh variable set CLOUDFRONT_ID --body "${{ steps.tf_out.outputs.CLOUDFRONT_ID }}"
      - name: SCP scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP}}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/infra/configure-server.sh,scripts/db/schema.sql"
          target: "/tmp/mint-backend/"
          strip_components: 2

      - name: Configure EC2 & RDS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_out.outputs.EC2_PUBLIC_IP }}
          username: admin
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /opt/mint-backend/config/
            sudo cp -r /tmp/mint-backend/ /opt
            sudo bash /opt/mint-backend/configure-server.sh
            PGPASSWORD="${{ secrets.DB_PASSWORD }}" PGSSLMODE="verify-full" PGSSLROOTCERT="/opt/mint-backend/config/global-bundle.pem" psql -U ${{ secrets.DB_USERNAME }} -d mintdb -h ${{ steps.tf_out.outputs.RDS_ENDPOINT }} -f /opt/mint-backend/schema.sql
