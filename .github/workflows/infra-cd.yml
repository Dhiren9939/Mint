name: infra-cd

on:
  workflow_call:
    outputs:
      APP_HOST:
        value: ${{ jobs.apply.outputs.APP_HOST }}
  workflow_dispatch:
  push:
    branches: [fast-deploy-single-ec2]
    paths:
      - "infra/**"
      - ".github/workflows/infra-cd.yml"
      - ".github/actions/setup-aws-terraform/**"

concurrency:
  group: fast-deploy-single-ec2-infrastructure
  cancel-in-progress: false

jobs:
  # validate, plan and apply in one job, so terraform only inits once
  apply:
    environment: fast-deploy-single-ec2
    permissions:
      id-token: write
      contents: read
    outputs:
      APP_HOST: ${{ steps.tf_out.outputs.APP_HOST }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: fast-deploy-single-ec2
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          working-directory: "./infra"
          environment: ${{ env.ENVIRONMENT }}

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -lock-timeout=20m -var-file="envs/$ENVIRONMENT.tfvars" -out .planfile

      - name: Terraform Apply
        run: terraform apply -no-color -input=false .planfile

      - name: Output Resource Details
        id: tf_out
        run: echo "APP_HOST=$(terraform output -raw api_domain)" >> "$GITHUB_OUTPUT"

      - name: Update Environment Variables
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          APP_HOST: ${{ steps.tf_out.outputs.APP_HOST }}
        run: gh variable set APP_HOST --env "$ENVIRONMENT" --body "$APP_HOST"
