name: infra-ci

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
        default: prod
  workflow_dispatch:
    inputs:
      environment:
        type: string
        required: false
        default: prod
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-cd.yml"
      - ".github/workflows/scripts/**"
      - ".github/actions/setup-aws-terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    environment: ${{ inputs.environment || 'prod' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          working-directory: "./infra"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -lock-timeout=20m -out .planfile
        continue-on-error: true

      - name: Add PR Comment
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@v3.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: .planfile
          working-directory: ./infra

      - name: Set Failure Exit Code
        if: steps.plan.outcome == 'failure'
        run: exit 1
