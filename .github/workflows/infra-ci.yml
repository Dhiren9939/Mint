name: infra-ci

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-cd.yml"
      - ".github/workflows/scripts/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7
        name: Checkout Files

      - uses: hashicorp/setup-terraform@v4
        name: Setup Terraform
        with:
          terraform_version: "1.15.3"

      - uses: aws-actions/configure-aws-credentials@v6
        name: Configure AWS Credentials
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        id: plan
        run: terraform plan -no-color -input=false -lock-timeout=20m -out .planfile
        continue-on-error: true

      - name: Add PR Comment
        if: github.event_name == 'pull_request'
        uses: borchero/terraform-plan-comment@v3.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          planfile: .planfile
          working-directory: ./infra

      - name: Set Failure Exit Code
        if: steps.plan.outcome == 'failure'
        run: exit 1
