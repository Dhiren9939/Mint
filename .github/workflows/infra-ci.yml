name: infra-ci

# Pull requests can't enter the environment, so they get credential-free checks.
# The real plan runs in infra-cd right before the apply.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-cd.yml"
      - ".github/actions/setup-aws-terraform/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.3"

      - name: Terraform Format
        run: terraform fmt -check -recursive -no-color

      - name: Terraform Validate
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
