name: frontend-cd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["frontend/**"]

permissions:
  contents: read
  id-token: write

jobs:
  run-ci:
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    needs: run-ci
    runs-on: ubuntu-latest

    steps:
      - name: Download build
        uses: actions/download-artifact@v8.0.0
        with:
          artifact-ids: ${{ needs.run-ci.outputs.build-id }}
          path: /tmp/build

      - run: ls /tmp/build
