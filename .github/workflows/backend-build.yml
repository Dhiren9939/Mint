name: backend-build

# tests and image build run side by side, the image goes to ghcr

on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.build-push.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        id: tag
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "repo=ghcr.io/${OWNER,,}/mint-backend" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/mint-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # the branch tag is what a fresh box pulls on boot, latest belongs to main
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.repo }}:fast-deploy-single-ec2
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
